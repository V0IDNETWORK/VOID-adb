name: 🚀 Feature Request
description: Suggest a new feature or improvement for VoidRemote
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to suggest a feature!
        Please describe your idea as clearly as possible.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: This feature would benefit the general VoidRemote user base
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      options:
        - CLI
        - GUI / Interface
        - Device Connection
        - Screen Mirroring
        - File Manager
        - Shell Terminal
        - Monitoring / Graphs
        - APK Management
        - Automation / Macros
        - Settings
        - Documentation
        - Packaging / Distribution
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this feature solve? What use case does it address?
      placeholder: I'm frustrated when… / It would be very useful to…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like to see implemented.
      placeholder: I would like VoidRemote to…
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative approaches or workarounds?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Mockups, screenshots, links to similar features in other tools, etc.
    validations:
      required: false
