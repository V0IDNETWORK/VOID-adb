[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voidremote"
version = "1.0.0"
description = "Wireless Android Remote Controller over ADB"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "V0IDNETWORK", email = "ilianothingg@gmail.com" }
]
keywords = ["android", "adb", "remote", "wireless", "scrcpy", "mirroring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: System :: Hardware",
    "Topic :: Communications",
]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "adb-shell>=0.4.4",
    "Pillow>=10.3.0",
    "psutil>=5.9.8",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "cryptography>=42.0.0",
    "appdirs>=1.4.4",
    "requests>=2.32.0",
    "numpy>=1.26.4",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "black>=24.4.2",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "types-requests>=2.32.0",
    "types-Pillow>=10.2.0",
    "types-psutil>=5.9.5",
    "types-appdirs>=1.4.3",
    "pre-commit>=3.7.1",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/V0IDNETWORK/VoidRemote"
Documentation = "https://github.com/V0IDNETWORK/VoidRemote/wiki"
Repository = "https://github.com/V0IDNETWORK/VoidRemote"
"Bug Tracker" = "https://github.com/V0IDNETWORK/VoidRemote/issues"
Author = "http://voidNetwork.ir/"

[project.scripts]
voidremote = "voidremote.cli.main:cli"

[project.gui-scripts]
voidremote-gui = "voidremote.ui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["voidremote*"]

[tool.setuptools.package-data]
voidremote = ["assets/**/*"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
]
ignore = [
    "ANN101",  # Missing type annotation for `self`
    "ANN102",  # Missing type annotation for `cls`
    "S101",    # Use of `assert` detected (fine in tests)
    "S603",    # subprocess without shell=True
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=voidremote",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-v",
]

[tool.coverage.run]
source = ["voidremote"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
